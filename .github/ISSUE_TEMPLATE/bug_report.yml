name: Bug report
description: Something in BaselineZ does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is **public**: do not include confidential project data, screenshots of proprietary models,
        customer names or credentials. Email support@baselinez.com for anything private.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the problem occur?
      options:
        - Meta Quest app
        - PCVR (Windows)
        - IGLOO app
        - IMMERSA app
        - Mobile AR (iOS / Android)
        - XR glasses (beta)
        - Web Portal
        - Petrel plugin
        - BaselineZ Studio
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BaselineZ version
      description: The release you are using, for example 2026.2. Add the build number if you know it.
      placeholder: "2026.2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, how can we reproduce it, and what did you expect instead? Please mention your device or headset.
      placeholder: |
        Meta Quest 3

        1. Open project ...
        2. Select ...
        3. Expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here. Remove anything confidential first.
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: This report contains no confidential data.
          required: true
