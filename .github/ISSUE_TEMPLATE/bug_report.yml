name: Bug report
description: Something in BaselineZ does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is **public**: do not include confidential project data, screenshots of proprietary models,
        customer names or credentials. Email support@baselinez.com for anything private.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong, and how can we reproduce it? Please include the BaselineZ version and your device or headset.
      placeholder: |
        Version: 2026.2, Meta Quest 3

        1. Open project ...
        2. Select ...
        3. Expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here. Remove anything confidential first.
